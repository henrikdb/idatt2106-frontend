image: node:latest # Much smaller than other variants, faster and more resource effective

stages:
  - install_dependencies
  - lint
  - build_project

install_dependencies:
  stage: install_dependencies
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules

build_project:
  stage: build_project
  script:
    - npm run build
  artifacts:
    paths:
      - node_modules/

