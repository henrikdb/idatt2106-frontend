image: node:alpine # Much smaller than other variants, faster and more resource effective

stages:
  - install_dependencies
  - lint
  - build_project

cache:
  key: "node repository" # Static Cache Key to keep cache across branches 
  paths:
    - node_modules/

install_dependencies:
  stage: install_dependencies
  image: node:latest
  script:
    - npm install

lint:
  stage: lint
  image: node:latest
  script:
    - npm run lint    
  allow_failure: true  

build_project:
  stage: build_project
  image: node:latest
  script:
    - npm run build

