image: node:alpine # Much smaller than other variants, faster and more resource effective

variables:
  DOCKER_TLS_CERTDIR: ""

cache:
  key: "${CI_COMMIT_REF_SLUG}" # Branch-specific cache keys to have separate caches across branches.
  paths:
    - node_modules/
    - build/

stages:
  - docker_build_and_push
  - deploy_docker

docker_build_and_push:
  stage: docker_build_and_push
  image: docker:latest
  services:
    - docker:dind
  tags:
    - dind
  script:
    - docker login -u $DOCKER_USER -p $DOCKER_PAT registry.gitlab.com
    - docker build -t registry.gitlab.com/$DOCKER_USER/sparesti-registry:frontend .
    - docker push registry.gitlab.com/$DOCKER_USER/sparesti-registry:frontend
  when: manual

deploy_docker:
  stage: deploy_docker
  image: ubuntu:latest
  dependencies:
    - docker_build_and_push
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - apt-get install sshpass
  script:
    - sshpass -p sParest1en ssh -v -o StrictHostKeyChecking=no root@128.199.53.153 "docker rm -f frontend || true; docker run -d --name -p 80:5173 frontend registry.gitlab.com/$DOCKER_USER/sparesti-registry:frontend"
  when: manual